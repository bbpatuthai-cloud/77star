<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบจัดการร้าน</title>

<style>
/* คง CSS เดิมไว้ทั้งหมด */
*{box-sizing:border-box}
body{ margin:0; font-family:Arial,"Tahoma",sans-serif; background:#0b0910; color:#fff; }
.sidebar{ position:fixed; left:0; top:0; bottom:0; width:240px; background:#15101b; border-right:1px solid #382540; padding:25px 15px; }
.logo{ font-size:27px; font-weight:bold; color:#e9a1ff; padding:0 15px 30px; word-break: break-all; line-height: 1.2; }
.logo span{ color:#fff; }
.menu{ display:flex; flex-direction:column; gap:8px; }
.menu button{ border:0; background:transparent; color:#b9afc0; padding:14px 16px; text-align:left; border-radius:10px; font-size:15px; cursor:pointer; }
.menu button:hover, .menu button.active{ background:#33203c; color:#fff; }
.main{ margin-left:240px; padding:30px; }
.topbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:30px; }
.topbar h1{ margin:0; font-size:28px; }
.status{ background:#16251b; color:#7dffab; border:1px solid #295c3b; padding:9px 15px; border-radius:20px; font-size:13px; }
.page{ display:none; }
.page.active{ display:block; }
.cards{ display:grid; grid-template-columns:repeat(4,1fr); gap:18px; }
.card{ background:#15101b; border:1px solid #382540; border-radius:15px; padding:22px; }
.card .icon{ font-size:25px; }
.card .label{ color:#aaa0ae; margin-top:12px; font-size:14px; }
.card .value{ font-size:28px; font-weight:bold; margin-top:7px; color:#e9a1ff; }
.section{ margin-top:25px; }
.section-title{ font-size:20px; font-weight:bold; margin-bottom:15px; }
.panel{ background:#15101b; border:1px solid #382540; border-radius:15px; padding:20px; }
table{ width:100%; border-collapse:collapse; }
th,td{ padding:15px 10px; text-align:left; border-bottom:1px solid #302335; }
th{ color:#bcaec0; font-size:13px; }
td{ color:#eee; }
.badge{ display:inline-block; padding:5px 10px; border-radius:15px; font-size:12px; }
.success{ background:#183a27; color:#7dffab; }
.warning{ background:#40351b; color:#ffd86b; }
.primary{ background:#3b2047; color:#e9a1ff; }
button.action{ background:#d98aff; border:0; color:#170d1b; padding:10px 16px; border-radius:8px; cursor:pointer; font-weight:bold; }
button.action:hover{ opacity:.85; }
.form-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:15px; }
input,select{ width:100%; padding:12px; background:#0e0b12; border:1px solid #46324d; border-radius:8px; color:#fff; outline:none; }
input:focus,select:focus{ border-color:#d98aff; }
.form-group label{ display:block; margin-bottom:7px; color:#bbb0c0; font-size:13px; }
.products{ display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
.product{ background:#15101b; border:1px solid #382540; border-radius:15px; padding:20px; position: relative; }
.product h3{ margin-top:0; color:#e9a1ff; }
.price{ font-size:22px; font-weight:bold; }
.empty{ text-align:center; color:#8d8292; padding:30px; }
.delete-btn { position: absolute; top: 15px; right: 15px; background: #ff4d4d; color: white; border: none; border-radius: 5px; padding: 5px 10px; cursor: pointer; font-size: 12px;}
.delete-btn:hover { background: #ff1a1a; }

@media(max-width:900px){
    .sidebar{ width:190px; }
    .main{ margin-left:190px; }
    .cards{ grid-template-columns:repeat(2,1fr); }
    .products{ grid-template-columns:repeat(2,1fr); }
}
@media(max-width:650px){
    .sidebar{ position:static; width:100%; height:auto; }
    .main{ margin-left:0; padding:15px; }
    .cards, .products, .form-grid{ grid-template-columns:1fr; }
}
</style>
</head>

<body>

<aside class="sidebar">
    <div class="logo" id="displayStoreName">★ <span>77</span> STAR</div>
    <div class="menu">
        <button class="active" onclick="showPage('dashboard',this)">📊 Dashboard</button>
        <button onclick="showPage('products',this)">📦 สินค้า</button>
        <button onclick="showPage('orders',this)">🧾 ออเดอร์</button>
        <button onclick="showPage('sales',this)">💰 ยอดขาย</button>
        <button onclick="showPage('customers',this)">👥 ลูกค้า</button>
        <button onclick="showPage('settings',this)">⚙️ ตั้งค่า</button>
    </div>
</aside>

<main class="main">

<div class="topbar">
    <h1 id="pageTitle">Dashboard</h1>
    <div class="status">● ระบบออนไลน์</div>
</div>

<!-- DASHBOARD -->
<section id="dashboard" class="page active">
    <!-- (ลดทอนเนื้อหาการ์ดลงเพื่อให้สั้นกระชับ สามารถใช้โค้ดเดิมของคุณตรงนี้ได้เลย) -->
    <div class="cards">
        <div class="card"><div class="icon">💰</div><div class="label">ยอดขายวันนี้</div><div class="value">฿0</div></div>
        <div class="card"><div class="icon">🧾</div><div class="label">ออเดอร์วันนี้</div><div class="value">0</div></div>
        <div class="card"><div class="icon">📦</div><div class="label">สินค้าทั้งหมด</div><div class="value" id="dashboardProductCount">0</div></div>
        <div class="card"><div class="icon">👥</div><div class="label">ลูกค้าทั้งหมด</div><div class="value">0</div></div>
    </div>
    <div class="section">
        <div class="section-title">ออเดอร์ล่าสุด</div>
        <div class="panel">
            <div class="empty">ยังไม่มีออเดอร์</div>
        </div>
    </div>
</section>

<!-- PRODUCTS -->
<section id="products" class="page">
    <div class="section">
        <div class="section-title">จัดการสินค้า</div>
        <div class="panel">
            <div class="form-grid">
                <div class="form-group">
                    <label>ชื่อสินค้า</label>
                    <input id="productName" placeholder="เช่น เสื้อยืดสีดำ">
                </div>
                <div class="form-group">
                    <label>ราคา</label>
                    <input id="productPrice" type="number" placeholder="399">
                </div>
            </div>
            <br>
            <button class="action" onclick="addProduct()">+ เพิ่มสินค้า</button>
        </div>
    </div>
    <div class="section">
        <div class="products" id="productList">
            <!-- สินค้าจะถูกสร้างตรงนี้ด้วย Javascript -->
        </div>
    </div>
</section>

<!-- ORDERS, SALES, CUSTOMERS ซ่อนไว้ชั่วคราวเพื่อความสั้น (ใช้โค้ดเดิมของคุณได้เลย) -->
<section id="orders" class="page"><div class="section"><div class="panel"><div class="empty">ระบบอยู่ระหว่างการพัฒนา</div></div></div></section>
<section id="sales" class="page"><div class="section"><div class="panel"><div class="empty">ระบบอยู่ระหว่างการพัฒนา</div></div></div></section>
<section id="customers" class="page"><div class="section"><div class="panel"><div class="empty">ระบบอยู่ระหว่างการพัฒนา</div></div></div></section>

<!-- SETTINGS -->
<section id="settings" class="page">
    <div class="section">
        <div class="section-title">ตั้งค่าร้าน</div>
        <div class="panel">
            <div class="form-grid">
                <div class="form-group">
                    <label>ชื่อร้าน (อัปเดตโลโก้ทันที)</label>
                    <input id="settingStoreName" value="77 STAR">
                </div>
                <div class="form-group">
                    <label>สกุลเงิน</label>
                    <select id="settingCurrency">
                        <option value="THB">THB - บาท</option>
                        <option value="USD">USD - ดอลลาร์</option>
                    </select>
                </div>
            </div>
            <br>
            <button class="action" onclick="saveSettings()">บันทึกการตั้งค่า</button>
        </div>
    </div>
</section>

</main>

<script>
// 1. กำหนดค่าเริ่มต้นและดึงข้อมูลจาก Local Storage
let storeData = JSON.parse(localStorage.getItem('myStoreData')) || {
    storeName: "77 STAR",
    currency: "THB",
    products: []
};

// 2. ฟังก์ชันอัปเดตหน้าจอเมื่อโหลดเว็บ
function initApp() {
    document.getElementById('settingStoreName').value = storeData.storeName;
    document.getElementById('settingCurrency').value = storeData.currency;
    document.title = storeData.storeName + " - ระบบจัดการร้าน";
    
    updateStoreUI();
    renderProducts();
}

// 3. ฟังก์ชันอัปเดตชื่อร้านและสัญลักษณ์เงิน
function updateStoreUI() {
    document.getElementById('displayStoreName').innerHTML = `★ <span>${storeData.storeName}</span>`;
    document.getElementById('dashboardProductCount').innerText = storeData.products.length;
}

// 4. ฟังก์ชันแสดงรายการสินค้า
function renderProducts() {
    const list = document.getElementById("productList");
    list.innerHTML = "";
    
    if(storeData.products.length === 0) {
        list.innerHTML = `<div class="empty" style="grid-column: 1 / -1;">ยังไม่มีสินค้า กดเพิ่มสินค้าด้านบนได้เลย</div>`;
        return;
    }

    let currencySymbol = storeData.currency === "THB" ? "฿" : "$";

    storeData.products.forEach((product, index) => {
        list.innerHTML += `
            <div class="product">
                <button class="delete-btn" onclick="deleteProduct(${index})">ลบ</button>
                <h3>${product.name}</h3>
                <div class="price">${currencySymbol}${Number(product.price).toLocaleString()}</div>
                <p><span class="badge success">มีสินค้า</span></p>
            </div>
        `;
    });
}

// 5. ฟังก์ชันเพิ่มสินค้า (บันทึกข้อมูลลงเครื่อง)
function addProduct() {
    const name = document.getElementById("productName").value.trim();
    const price = document.getElementById("productPrice").value;

    if(!name || !price) {
        alert("กรุณากรอกชื่อสินค้าและราคา");
        return;
    }

    // เพิ่มลงใน Array
    storeData.products.push({ name: name, price: price });
    
    // บันทึกลง Local Storage
    localStorage.setItem('myStoreData', JSON.stringify(storeData));

    // ล้างค่าฟอร์มและโหลดหน้าใหม่
    document.getElementById("productName").value = "";
    document.getElementById("productPrice").value = "";
    
    updateStoreUI();
    renderProducts();
    alert("เพิ่มสินค้าเรียบร้อยแล้ว");
}

// 6. ฟังก์ชันลบสินค้า
function deleteProduct(index) {
    if(confirm("ต้องการลบสินค้านี้ใช่หรือไม่?")) {
        storeData.products.splice(index, 1);
        localStorage.setItem('myStoreData', JSON.stringify(storeData));
        updateStoreUI();
        renderProducts();
    }
}

// 7. ฟังก์ชันบันทึกการตั้งค่า
function saveSettings() {
    storeData.storeName = document.getElementById('settingStoreName').value;
    storeData.currency = document.getElementById('settingCurrency').value;
    
    localStorage.setItem('myStoreData', JSON.stringify(storeData));
    
    updateStoreUI();
    renderProducts(); // เพื่ออัปเดตสกุลเงิน
    document.title = storeData.storeName + " - ระบบจัดการร้าน";
    
    alert("บันทึกการตั้งค่าเรียบร้อยแล้ว");
}

// ฟังก์ชันสลับเมนู (โค้ดเดิมของคุณ)
function showPage(page, button){
    document.querySelectorAll(".page").forEach(el => el.classList.remove("active"));
    document.getElementById(page).classList.add("active");
    
    document.querySelectorAll(".menu button").forEach(el => el.classList.remove("active"));
    button.classList.add("active");

    const titles = {
        dashboard:"Dashboard", products:"จัดการสินค้า", orders:"ออเดอร์",
        sales:"ยอดขาย", customers:"ลูกค้า", settings:"ตั้งค่า"
    };
    document.getElementById("pageTitle").textContent = titles[page];
}

// เริ่มทำงานเมื่อเปิดหน้าเว็บ
window.onload = initApp;

</script>

</body>
</html>
